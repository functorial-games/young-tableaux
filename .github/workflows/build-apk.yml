name: Build Young Tableaux APK

on:
  push:
    branches:
      - sun-y1-native-exploration
  pull_request:
    branches:
      - main
      - tables
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  modified-lua-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Exact consumer source and Lua gitlink
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Exact shared runtime admission source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/flexible-pipes
          ref: 5caaba31256bfb424638f8a3d4d554c56fa9a970
          path: runtime-owner
          persist-credentials: false
      - name: Same-version stock control
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/lua
          ref: 0b29f408433e92953cc72b1d3e06c7ac8139e439
          path: stock-source
          persist-credentials: false
      - name: Exact qualified host ICK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/fastchat
          run-id: 37589849631
          artifact-ids: 11468256648
          merge-multiple: true
          github-token: ${{ github.token }}
          path: host-ick
      - name: Exact Grease implementation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 37478624499
          artifact-ids: 11419719229
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease-runtime
      - name: Exact Grease packaging source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/grease
          ref: ba869518c7d850de6c47d8c6234654575e264e6c
          path: grease-owner
          persist-credentials: false
      - name: Shared build and workflow policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: 01608a2493fa409463f70e8fbfd8a123ef59ee85
          path: shared-policy
          persist-credentials: false
      # These fixed packaging commands reproduce the runtime owner's launcher.
      # All authored qualification policy is Grease in tests/qualify-lua.grease.
      - name: Check Grease implementation bytes
        run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease-runtime/_bin/cxx-asan/ysh' | sha256sum -c -
      - name: Reuse unchanged Grease owner launcher
        run: sed -n '123,125p' grease-owner/phone/build-armv7-runtime.sh > grease-runtime/grease
      - name: Install engine at owner launcher path
        run: cp grease-runtime/_bin/cxx-asan/ysh grease-runtime/ysh
      - name: Restore artifact executable modes
        run: chmod +x host-ick/compiler/build/gcc/xgcc host-ick/compiler/build/gcc/cc1 host-ick/compiler/build/gcc/collect2 grease-runtime/grease grease-runtime/ysh
      - name: Producer dependency closure
        run: sudo apt-get install -y libgmp10 libmpfr6 libmpc3 libisl23 libzstd1 ripgrep
      - name: Build shared toolchain verifier through ICK
        run: >
          host-ick/compiler/build/gcc/xgcc -Bhost-ick/compiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -fno-use-linker-plugin -std=c11 -O2 shared-policy/src/aici.c -o shared-policy-check
      - name: Required shared build-toolchain contract
        run: ./shared-policy-check verify shared-policy/contracts/build-toolchain-v0.contract.tsv .
      - name: Build shared workflow verifier through ICK
        run: >
          host-ick/compiler/build/gcc/xgcc -Bhost-ick/compiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -fno-use-linker-plugin -std=c17 -O2 shared-policy/src/aici_github.c -o workflow-policy-check
      - name: Required shared workflow policy
        run: ./workflow-policy-check verify . - public
      - name: Actual interpreter, embedded consumer and negative controls
        run: >
          grease-runtime/grease tests/qualify-lua.grease
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/runtime-owner"
          "$GITHUB_WORKSPACE/stock-source" "$GITHUB_WORKSPACE/host-ick/compiler/build/gcc/xgcc"
          "$GITHUB_WORKSPACE/host-ick/compiler/build/gcc" "$GITHUB_WORKSPACE/grease-runtime/grease"
          "$RUNNER_TEMP/young-lua-admission"
      - name: Qualify current division-glyph host frontend
        id: app-ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Native host mathematics, ownership controls and sanitizers through ICK
        run: >
          grease-runtime/grease test-host.ysh "$GITHUB_WORKSPACE"
          "${{ steps.app-ick.outputs.compiler }}"
          > "$RUNNER_TEMP/young-lua-admission/native-host.stdout"
          2> "$RUNNER_TEMP/young-lua-admission/native-host.stderr"
      - name: Preserve exact-head admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: young-lua-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/young-lua-admission/
          if-no-files-found: error
      - name: Preserve exact-head native negative-control logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: young-native-controls-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/*.log
          if-no-files-found: error
  build:
    needs: [modified-lua-admission, compilers]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Check out shared ICK source producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 4ea071a96239f3a29ca6d98454feb59947d87cfe
          path: .ai-ci-ick
      - name: Download qualified compiler stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: .ick-packages
          merge-multiple: true
      - name: Restore qualified compiler stages
        run: |
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/.ick-stages/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/.ick-packages/ick-armeabi-v7a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/.ick-stages/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/.ick-packages/ick-arm64-v8a.tar.gz"

      - name: Exact-head prerequisite admission receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: young-lua-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: admission-evidence

      - name: Verify symbolic Lua fork
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/lua rev-parse HEAD)" = 87306483cec50f8c750a22dda1d0742246fad756

      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Fetch stable public Wegert signer
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL \
            "https://raw.githubusercontent.com/isomorphismes/wegert/dfa3751f0282cdf6a2083c97063b0e8e996d0d92/_/build/app/wegert-debug.keystore" \
            -o "$RUNNER_TEMP/wegert-debug.keystore"
          keytool -exportcert \
            -keystore "$RUNNER_TEMP/wegert-debug.keystore" \
            -storetype PKCS12 \
            -storepass wegert-debug \
            -alias wegert-debug |
            sha256sum |
            grep -qi '^de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9 '

      - name: Compile and package ARMv7 NativeActivity APK
        shell: bash
        run: |
          set -euxo pipefail

          project="$GITHUB_WORKSPACE"
          sdk="$ANDROID_HOME"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          tools="$sdk/build-tools/35.0.0"
          clang_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          glue="$ndk/sources/android/native_app_glue"
          out="$project/build"
          compiler="$clang_bin/armv7a-linux-androideabi26-clang"

          rm -rf "$out"
          mkdir -p "$out/objects" "$out/staging/lib/armeabi-v7a"

          make -f "$project/icky/Android.mk" native ABI=armeabi-v7a NDK="$ndk" \
            BUILD="$out/objects" OUT="$out/staging/lib/armeabi-v7a/libyoungtableaux.so"

          "$clang_bin/llvm-strip" --strip-unneeded \
            "$out/staging/lib/armeabi-v7a/libyoungtableaux.so"

          "$tools/aapt2" link \
            -I "$sdk/platforms/android-34/android.jar" \
            -A "$project/app/assets" \
            --manifest "$project/app/AndroidManifest.xml" \
            --min-sdk-version 26 \
            --target-sdk-version 34 \
            --version-code 9 \
            --version-name 0.4.0 \
            -o "$out/unsigned.apk"

          (
            cd "$out/staging"
            touch -t 198001010000 lib/armeabi-v7a/libyoungtableaux.so
            zip -X -0 -q "$out/unsigned.apk" lib/armeabi-v7a/libyoungtableaux.so
          )

          "$tools/zipalign" -f -P 16 4 \
            "$out/unsigned.apk" "$out/aligned.apk"

          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/wegert-debug.keystore" \
            --ks-type PKCS12 \
            --ks-key-alias wegert-debug \
            --ks-pass pass:wegert-debug \
            --key-pass pass:wegert-debug \
            --out "$out/young-tableaux-armeabi-v7a.apk" \
            "$out/aligned.apk"

          "$tools/apksigner" verify --verbose --print-certs \
            "$out/young-tableaux-armeabi-v7a.apk" | tee "$out/signing.txt"

          grep -qi \
            'Signer #1 certificate SHA-256 digest: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9' \
            "$out/signing.txt"

          "$clang_bin/llvm-readelf" -h -A -l \
            "$out/staging/lib/armeabi-v7a/libyoungtableaux.so" \
            > "$out/abi.txt"

          "$tools/aapt2" dump badging \
            "$out/young-tableaux-armeabi-v7a.apk" \
            > "$out/package.txt"

          sha256sum "$out/young-tableaux-armeabi-v7a.apk" | tee "$out/apk.sha256"
          git rev-parse HEAD | tee "$out/source.txt"
          cp -r "$project/admission-evidence" "$out/admission-evidence"
          git archive HEAD | gzip -n > "$out/source.tar.gz"
          tar -czf "$out/lua-source.tar.gz" --exclude=.git third_party/lua

      - name: Compile and package C67 AArch64 NativeActivity APK
        shell: bash
        run: |
          set -euxo pipefail

          project="$GITHUB_WORKSPACE"
          sdk="$ANDROID_HOME"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          tools="$sdk/build-tools/35.0.0"
          clang_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          glue="$ndk/sources/android/native_app_glue"
          out="$project/build/c67"
          compiler="$clang_bin/aarch64-linux-android26-clang"

          rm -rf "$out"
          mkdir -p "$out/objects" "$out/staging/lib/arm64-v8a"

          make -f "$project/icky/Android.mk" native ABI=arm64-v8a NDK="$ndk" \
            BUILD="$out/objects" OUT="$out/staging/lib/arm64-v8a/libyoungtableaux.so"

          "$clang_bin/llvm-strip" --strip-unneeded \
            "$out/staging/lib/arm64-v8a/libyoungtableaux.so"

          "$tools/aapt2" link \
            -I "$sdk/platforms/android-34/android.jar" \
            -A "$project/app/assets" \
            --manifest "$project/app/AndroidManifest.xml" \
            --min-sdk-version 26 \
            --target-sdk-version 34 \
            --version-code 9 \
            --version-name 0.4.0 \
            -o "$out/unsigned.apk"

          (
            cd "$out/staging"
            touch -t 198001010000 lib/arm64-v8a/libyoungtableaux.so
            zip -X -0 -q "$out/unsigned.apk" lib/arm64-v8a/libyoungtableaux.so
          )

          "$tools/zipalign" -f -P 16 4 \
            "$out/unsigned.apk" "$out/aligned.apk"

          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/wegert-debug.keystore" \
            --ks-type PKCS12 \
            --ks-key-alias wegert-debug \
            --ks-pass pass:wegert-debug \
            --key-pass pass:wegert-debug \
            --out "$out/young-tableaux-arm64-v8a.apk" \
            "$out/aligned.apk"

          "$tools/apksigner" verify --verbose --print-certs \
            "$out/young-tableaux-arm64-v8a.apk" | tee "$out/signing.txt"

          grep -qi \
            'Signer #1 certificate SHA-256 digest: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9' \
            "$out/signing.txt"

          "$clang_bin/llvm-readelf" -h -l \
            "$out/staging/lib/arm64-v8a/libyoungtableaux.so" \
            > "$out/abi.txt"
          grep -Eq 'Class:[[:space:]]+ELF64' "$out/abi.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$out/abi.txt"

          "$tools/aapt2" dump badging \
            "$out/young-tableaux-arm64-v8a.apk" \
            > "$out/package.txt"
          grep -q "native-code: 'arm64-v8a'" "$out/package.txt"

          sha256sum "$out/young-tableaux-arm64-v8a.apk" | tee "$out/apk.sha256"
          git rev-parse HEAD | tee "$out/source.txt"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: young-tableaux-apk
          path: |
            build/young-tableaux-armeabi-v7a.apk
            build/apk.sha256
            build/signing.txt
            build/abi.txt
            build/package.txt
            build/source.txt
            build/admission-evidence/
            build/source.tar.gz
            build/lua-source.tar.gz
            build/c67/young-tableaux-arm64-v8a.apk
            build/c67/apk.sha256
            build/c67/signing.txt
            build/c67/abi.txt
            build/c67/package.txt
            build/c67/source.txt
          if-no-files-found: error
          retention-days: 7
