name: Independent mathematical audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify current division-glyph host frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Kill mathematical mutants
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          compiler = pathlib.Path('${{ steps.ick.outputs.compiler }}')
          subprocess.run([sys.executable, 'tests/audit_mutations.py', '--compiler', str(compiler)], check=True)
      - name: Check all operations against independent oracles
        if: always()
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          compiler = pathlib.Path('${{ steps.ick.outputs.compiler }}')
          subprocess.run([sys.executable, 'tests/independent_audit.py', '--compiler', str(compiler)], check=True)
      - name: Preserve mathematical counterexamples and mutation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-mathematical-audit
          path: |
            build/independent-audit.tsv
            build/public-dispatch.tsv
            build/mutations/*.tsv
            build/mutations/*.log
      - name: Check renderer integer bounds when the plot is present
        if: always()
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          compiler = pathlib.Path('${{ steps.ick.outputs.compiler }}')
          subprocess.run([sys.executable, 'tests/audit_renderer.py', '--compiler', str(compiler)], check=True)
