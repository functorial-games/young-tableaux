name: Jeu de taquin pixel and typed provenance contract

on:
  pull_request:
    branches: [tables]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observable-jdt:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualify current division-glyph host frontend
        id: ick
        uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
      - name: Execute real painter and reject silent mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/jeu_visual_contract.py \
            --compiler "${{ steps.ick.outputs.compiler }}" \
            --compiler-flag=-fno-link-libatomic
          cat build/jdt-visual-evidence/receipt.tsv
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdt-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/jdt-visual-evidence/
          if-no-files-found: warn

  typed-jdt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact mathematical consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin actual Idriç compiler source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: 94dfd99bd3e376507fedc8611053b7173b2519f0
          path: idric-toolchain
          persist-credentials: false
      - name: Build owned Idriç compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 util-linux
          ( cd idric-toolchain/_ && ./edric all )
          test -x idric-toolchain/_/build/exec/idris2
      - name: Typecheck and execute signed-neighbor/provenance rules
        shell: bash
        run: |
          set -euo pipefail
          compiler="$GITHUB_WORKSPACE/idric-toolchain/_/build/exec/idris2"
          export PATH="$GITHUB_WORKSPACE/idric-toolchain/_/.tools/bin:$PATH"
          export IDRIS2_PREFIX="$GITHUB_WORKSPACE/idric-toolchain/_/build/env"
          "$compiler" --source-dir types --check types/YoungTableaux/JeuTrace.idric
          IDRIS2_PATH="$GITHUB_WORKSPACE/build/ttc" "$compiler" \
            --source-dir examples/autogenerated/jeu-trace \
            -o jeu-trace-checks \
            examples/autogenerated/jeu-trace/JeuTraceChecks.idric
          build/exec/jeu-trace-checks
