name: Jeu de taquin pixel and typed provenance contract

on:
  pull_request:
    branches: [tables]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observable-jdt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore pinned Android NDK host compiler
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
      - name: Execute real painter and reject silent mutants
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 tests/jeu_visual_contract.py \
            --compiler "$ndk/clang" \
            --compiler-flag=--target=x86_64-linux-gnu \
            --compiler-flag=--sysroot=/ \
            --compiler-flag=-rtlib=libgcc \
            --compiler-flag=-unwindlib=libgcc
          cat build/jdt-visual-evidence/receipt.tsv
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdt-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/jdt-visual-evidence/
          if-no-files-found: warn

  typed-jdt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact mathematical consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin actual Idriç compiler source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/Idric
          ref: ff4d852862a3942592f8ade9afde8d409d9803be
          path: idric-toolchain
          persist-credentials: false
      - name: Build owned Idriç compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 util-linux
          ( cd idric-toolchain && ./edric all )
          test -x idric-toolchain/build/exec/idris2
      - name: Typecheck and execute signed-neighbor/provenance rules
        shell: bash
        run: |
          set -euo pipefail
          compiler="$GITHUB_WORKSPACE/idric-toolchain/build/exec/idris2"
          "$compiler" --source-dir types --check types/YoungTableaux/JeuTrace.idric
          IDRIS2_PATH="$GITHUB_WORKSPACE/build/ttc" "$compiler" \
            --source-dir examples/autogenerated/jeu-trace \
            examples/autogenerated/jeu-trace/JeuTraceChecks.idric \
            --exec JeuTraceChecks.main
